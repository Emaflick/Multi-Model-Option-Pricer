[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qpricer"
version = "0.1.0"
description = "Multi-model option pricer (Black-76, Heston, SABR) for vanilla and exotic options, with SPX implied-vol calibration and Monte Carlo vs closed-form benchmarks"
readme = "README.md"
authors = [{name = "Emanuele Renzoni"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "matplotlib>=3.8", "pyarrow>=14", "yfinance>=0.2.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running Monte Carlo / calibration tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "NPY"]
